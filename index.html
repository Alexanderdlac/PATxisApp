<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador y Mapa - Google Maps</title>
    
    <!-- ⚠️ REEMPLAZA "TU_API_KEY_DE_GOOGLE" CON TU LLAVE REAL Y MANTÉN "async defer" ⚠️ -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBBRi4A6-jF6XUx5i6Em6QK5btf1xeEMMM&libraries=places" async defer></script>
    
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: Arial, sans-serif;
        }
        #map { height: 100vh; width: 100vw; }
        
        .search-container {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: white; padding: 10px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 90%; max-width: 450px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .search-container input {
            padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box;
        }
        .info-paso {
            font-size: 13px; font-weight: bold; color: #333; text-align: center;
        }

        .btn-redirigir {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: #28a745; color: white; padding: 14px 28px;
            font-size: 18px; font-weight: bold; border: none; border-radius: 8px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: none;
            transition: background 0.2s;
        }
        .btn-redirigir:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="info-paso" id="textoInstruccion">Paso 1: Busca o haz clic para marcar el <b>Punto A (Origen)</b></div>
        <input id="buscador" type="text" placeholder="Escribe una avenida, jirón o lugar..." />
    </div>

    <div id="map"></div>

    <button class="btn-redirigir" id="btnRedirigir" onclick="redirigirAPowerApps()">
        Redirigir a Power Apps
    </button>

    <script>
        var map;
        var markerA = null;
        var markerB = null;
        
        // Variables para coordenadas y direcciones escritas
        var coordA = null, dirA = "";
        var coordB = null, dirB = "";
        
        var pasoActual = 'A';
        var autocomplete;
        var geocoder; // Servicio para traducir coordenadas a texto de dirección

        function initMap() {
            var centroLima = { lat: -12.0464, lng: -77.0428 };
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 14,
                center: centroLima,
                mapTypeControl: false,
                streetViewControl: false
            });

            geocoder = new google.maps.Geocoder();

            // 1. Autocompletado del buscador
            var inputBuscador = document.getElementById('buscador');
            autocomplete = new google.maps.places.Autocomplete(inputBuscador);
            autocomplete.bindTo('bounds', map);

            // Cuando seleccionan un lugar del buscador desplegable
            autocomplete.addListener('place_changed', function() {
                var place = autocomplete.getPlace();
                if (!place.geometry || !place.geometry.location) {
                    alert("No se encontró la ubicación de este lugar.");
                    return;
                }

                var direccionTexto = place.formatted_address || inputBuscador.value;
                map.setCenter(place.geometry.location);
                map.setZoom(16);
                
                procesarUbicacionCompleta(place.geometry.location, direccionTexto);
            });

            // 2. Clic directo en el mapa
            map.addListener('click', function(e) {
                var clickedLocation = e.latLng;

                // Como es clic en el mapa, consultamos a Google la dirección exacta de esas coordenadas
                geocoder.geocode({ location: clickedLocation }, function(results, status) {
                    var direccionTexto = "Ubicación en el mapa";
                    if (status === "OK" && results[0]) {
                        direccionTexto = results[0].formatted_address;
                    }
                    procesarUbicacionCompleta(clickedLocation, direccionTexto);
                });
            });
        }

        // Procesa la asignación para el Punto A o el Punto B guardando coordenadas y texto
        function procesarUbicacion(location) {
            // Esta función queda integrada dentro de procesarUbicacionCompleta
        }

        function procesarUbicacionCompleta(location, direccionTexto) {
            if (pasoActual === 'A') {
                coordA = { lat: location.lat(), lng: location.lng() };
                dirA = direccionTexto;
                
                if (markerA) {
                    markerA.setPosition(location);
                } else {
                    markerA = new google.maps.Marker({
                        position: location,
                        map: map,
                        title: "Punto A (Origen)",
                        label: "A"
                    });
                }

                pasoActual = 'B';
                document.getElementById('textoInstruccion').innerHTML = 
                    "Paso 2: Busca o haz clic para marcar el <b>Punto B (Destino)</b>";
                document.getElementById('buscador').value = ""; 

            } else if (pasoActual === 'B') {
                coordB = { lat: location.lat(), lng: location.lng() };
                dirB = direccionTexto;
                
                if (markerB) {
                    markerB.setPosition(location);
                } else {
                    markerB = new google.maps.Marker({
                        position: location,
                        map: map,
                        title: "Punto B (Destino)",
                        label: "B",
                        icon: "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
                    });
                }

                pasoActual = 'completado';
                document.getElementById('textoInstruccion').innerHTML = 
                    "¡Puntos A y B seleccionados correctamente!";
                document.getElementById('buscador').style.display = 'none'; 
                document.getElementById('btnRedirigir').style.display = 'block';
            } else {
                // Si ya completó ambos y quiere ajustar el punto B moviéndolo de nuevo
                coordB = { lat: location.lat(), lng: location.lng() };
                dirB = direccionTexto;
                markerB.setPosition(location);
            }
        }

        function redirigirAPowerApps() {
            if (!coordA || !coordB) return;

            const urlParams = new URLSearchParams(window.location.search);
            var usuarioParam = urlParams.get('usuario') || '';

            // ⚠️ REEMPLAZA ESTA URL CON EL ENLACE WEB REAL DE TU POWER APP ⚠️
            var urlBasePowerApps = "https://apps.powerapps.com/play/e/default-ae544a57-aecb-4bf9-828a-5b520732b110/a/3a377f38-9b00-4d36-af1e-f63a02831a08?tenantId=ae544a57-aecb-4bf9-828a-5b520732b110&hint=c1f807bc-01e7-4151-8301-6cf480a7fe34&sourcetime=1788077086372&HideNavBar=true&";

            // Aquí mandamos coordenadas Y también las direcciones en texto plano (DirA y DirB)
            var urlFinal = urlBasePowerApps + 
                           "latA=" + coordA.lat + 
                           "&lonA=" + coordA.lng + 
                           "&dirA=" + encodeURIComponent(dirA) +
                           "&latB=" + coordB.lat + 
                           "&lonB=" + coordB.lng + 
                           "&dirB=" + encodeURIComponent(dirB) +
                           "&usr=" + encodeURIComponent(usuarioParam);

            window.location.replace(urlFinal);
        }

        window.onload = initMap;
    </script>
</body>
</html>
